name: ci
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go vet ./...
      - run: go test ./...
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go build -ldflags "-s -w" -o apichat.exe .
      - run: Compress-Archive -Path apichat.exe -DestinationPath "apichat-${{ github.ref_name }}-windows.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: apichat-*-windows.zip
          body: "Unzip and run apichat.exe. Settings, API key, chats and projects are kept when upgrading."
