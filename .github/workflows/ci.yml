name: ci
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go vet ./...
      - run: go test ./...
  release:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - id: ver
        shell: bash
        run: |
          v=$(grep -oP 'appVersion = "\K[^"]+' main.go)
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.ver.outputs.exists == 'false'
        run: go build -ldflags "-s -w" -o apichat.exe .
      - if: steps.ver.outputs.exists == 'false'
        run: Compress-Archive -Path apichat.exe -DestinationPath "apichat-${{ steps.ver.outputs.tag }}-windows.zip"
      - if: steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: APIChat ${{ steps.ver.outputs.tag }}
          files: apichat-*-windows.zip
          body: "Unzip and run apichat.exe. Settings, API key, chats and projects are kept when upgrading."
