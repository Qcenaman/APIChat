<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APIChat</title>
<link rel="stylesheet" href="/static/app.css">
<script>window.APICHAT_TOKEN = "{{TOKEN}}";</script>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="side-top">
      <button id="new-chat" class="primary">+ New chat</button>
    </div>
    <div id="chat-list"></div>
    <div class="side-bottom">
      <div id="meter" title="Spent this billing cycle">
        <div class="meter-bar"><div id="meter-fill"></div></div>
        <div class="meter-text"><span id="meter-spent">$0.00</span> of <span id="meter-budget">$200</span></div>
      </div>
      <div class="side-actions">
        <button id="open-usage" class="ghost">Usage</button>
        <button id="open-settings" class="ghost">Settings</button>
      </div>
    </div>
  </aside>
  <main id="main">
    <header id="head">
      <input id="title" placeholder="New chat" spellcheck="false">
      <select id="model"></select>
      <span id="chat-cost" title="Cost of this chat"></span>
    </header>
    <section id="messages"></section>
    <div id="status"></div>
    <footer id="composer">
      <div id="chips"></div>
      <div class="row">
        <button id="attach" class="ghost" title="Attach files">📎</button>
        <textarea id="input" rows="1" placeholder="Message APIChat…  (Enter to send, Shift+Enter for a new line)"></textarea>
        <button id="send" class="primary">Send</button>
        <button id="stop" class="danger hidden">Stop</button>
      </div>
      <input type="file" id="file" multiple hidden>
    </footer>
  </main>
</div>

<div id="modal" class="hidden">
  <div class="modal-box">
    <div class="modal-head"><h2 id="modal-title"></h2><button id="modal-close" class="ghost">✕</button></div>
    <div id="modal-body"></div>
  </div>
</div>

<script src="/static/marked.min.js"></script>
<script src="/static/purify.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
